<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NICE ONE — Pengadaan &amp; Gudang</title>

  <!-- Cadangan kalau JavaScript di bawah gagal jalan (jarang, tapi aman) -->
  <meta http-equiv="refresh" content="2; url=https://script.google.com/macros/s/AKfycbx2OGS8tOELyizp40uMbcCFLGd77VwIQqOlmz4Mw7wXvxJXxNa3pdHlr16HrV0ooyvL/exec">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kotak { text-align: center; padding: 2rem; }
    .logo { font-size: 28px; font-weight: 600; color: #1C5518; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
    .putar {
      width: 26px; height: 26px;
      border: 3px solid #e5e7eb;
      border-top-color: #1C5518;
      border-radius: 50%;
      animation: putar 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes putar { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: #9ca3af; }
    .manual { font-size: 13px; color: #9ca3af; margin-top: 24px; }
    .manual a { color: #1C5518; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="kotak">
    <div class="logo">nice</div>
    <div class="sub">Pengadaan &amp; Gudang</div>
    <div class="putar"></div>
    <p class="status">Mengarahkan ke aplikasi&hellip;</p>
    <p class="manual">
      Tidak berpindah otomatis?
      <a href="https://script.google.com/macros/s/AKfycbx2OGS8tOELyizp40uMbcCFLGd77VwIQqOlmz4Mw7wXvxJXxNa3pdHlr16HrV0ooyvL/exec">Klik di sini</a>
    </p>
  </div>

  <script>
    // K-081 (29 Sept 2026) — REDIRECT, bukan iframe. Safari iPhone selalu
    // memblokir sesi login yang dibungkus iframe (vibecode SOP §14.1).
    // window.location.replace (bukan .href) supaya halaman ini TIDAK masuk
    // riwayat back — tombol Back di HP tidak nyangkut balik ke sini.
    window.location.replace('https://script.google.com/macros/s/AKfycbx2OGS8tOELyizp40uMbcCFLGd77VwIQqOlmz4Mw7wXvxJXxNa3pdHlr16HrV0ooyvL/exec');
  </script>
</body>
</html>
